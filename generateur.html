<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Générateur de fiche</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{--ink:#0F1114;--brass:#B08D46;--paper:#F7F5F0;--card:#FFFFFF;--line:#E8E3D8;--text:#1D2024;--muted:#8A8377;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--text);padding:clamp(24px,4vw,48px) 16px 60px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-family:'Fraunces',serif;font-size:clamp(22px,2.6vw,28px);margin:0 0 6px;}
  .sub{font-size:13px;color:var(--muted);margin:0 0 26px;max-width:520px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:clamp(18px,3vw,28px);}
  .fields{display:grid;grid-template-columns:1fr;gap:0 20px;}
  @media(min-width:640px){.fields{grid-template-columns:1fr 1fr;}}
  .field{margin-top:14px;}
  .field:nth-child(-n+2){margin-top:0;}
  .field.full{grid-column:1 / -1;}
  label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:5px;}
  input, textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:5px;font-size:14px;font-family:'Inter',sans-serif;background:#FBFAF7;}
  input:focus, textarea:focus{outline:2px solid var(--brass);outline-offset:0;}
  .hint{font-size:11px;color:var(--muted);margin-top:4px;}
  button{margin-top:22px;width:100%;padding:13px;border:none;border-radius:5px;background:var(--ink);color:var(--brass);font-size:14px;font-weight:500;cursor:pointer;}
  .out{margin-top:26px;}
  .out h2{font-size:14px;margin:0 0 8px;}
  textarea#resultat{height:260px;font-family:monospace;font-size:12px;background:var(--ink);color:#E4D3A6;border:none;}
  .copy{margin-top:10px;background:transparent;border:1px solid var(--line);color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <h1>Générateur de fiche</h1>
  <p class="sub">Remplis les champs, génère le bloc JSON, colle-le dans profils.json juste avant le <code>]</code> final (avec une virgule après le <code>}</code> précédent).</p>

  <div class="card">
    <div class="fields">
      <div class="field"><label>Identifiant (unique, sans espace ni accent)</label><input id="id" placeholder="ex. prenom-nom"></div>
      <div class="field"><label>Nom complet</label><input id="nom" placeholder="ex. Prénom Nom"></div>
      <div class="field"><label>Fonction</label><input id="fonction" placeholder="ex. Technicien biomédical"></div>
      <div class="field"><label>Matricule</label><input id="matricule" placeholder="ex. BME-0142"></div>
      <div class="field"><label>Service</label><input id="service" placeholder="ex. Maintenance biomédicale"></div>
      <div class="field"><label>Membre depuis (année)</label><input id="depuis" placeholder="ex. 2023"></div>
      <div class="field full"><label>Courte présentation (une phrase)</label><textarea id="bio" rows="2" placeholder="ex. Spécialisé dans..."></textarea></div>
      <div class="field full"><label>Compétences (séparées par des virgules)</label><input id="competences" placeholder="ex. Maintenance dialyse, Électronique"></div>
      <div class="field"><label>Téléphone affiché</label><input id="telephoneAffiche" placeholder="ex. +229 01 XX XX XX XX"></div>
      <div class="field"><label>Email</label><input id="email" placeholder="ex. nom@entreprise.com"></div>
      <div class="field"><label>Localisation</label><input id="localisation" placeholder="ex. Cotonou, Bénin"></div>
      <div class="field"><label>LinkedIn (optionnel)</label><input id="linkedin" placeholder="https://linkedin.com/in/..."></div>
      <div class="field full">
        <label>Nom du fichier photo (optionnel)</label>
        <input id="photo" placeholder="ex. photos/prenom-nom.jpg">
        <div class="hint">Dépose la photo correspondante dans le dossier photos/ du dépôt.</div>
      </div>
    </div>

    <button onclick="generer()">Générer le bloc JSON</button>

    <div class="out">
      <h2>Résultat — à copier dans profils.json</h2>
      <textarea id="resultat" readonly></textarea>
      <button class="copy" onclick="copier()">Copier</button>
    </div>
  </div>
</div>

<script>
  function generer(){
    const g = id => document.getElementById(id).value.trim();
    const obj = {
      id: g("id"),
      nom: g("nom"),
      fonction: g("fonction"),
      matricule: g("matricule"),
      service: g("service"),
      depuis: g("depuis"),
      bio: g("bio"),
      competences: g("competences").split(",").map(s => s.trim()).filter(Boolean),
      telephone: g("telephoneAffiche").replace(/\s/g, ""),
      telephoneAffiche: g("telephoneAffiche"),
      email: g("email"),
      localisation: g("localisation"),
      linkedin: g("linkedin"),
      photo: g("photo")
    };
    document.getElementById("resultat").value = ",\n" + JSON.stringify(obj, null, 2);
  }
  function copier(){
    const t = document.getElementById("resultat");
    t.select();
    document.execCommand("copy");
  }
</script>
</body>
</html>
