<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil professionnel</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap');
  :root{
    --ink:#0F1114; --ink-2:#1B1E22; --brass:#B08D46; --brass-light:#E4D3A6;
    --paper:#F7F5F0; --card:#FFFFFF; --line:#E8E3D8; --text:#1D2024; --muted:#8A8377;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--text);display:flex;justify-content:center;padding:36px 16px;min-height:100vh;}
  a{color:inherit;}
  .card{width:100%;max-width:400px;background:var(--card);border-radius:6px;overflow:hidden;box-shadow:0 1px 1px rgba(15,17,20,.05), 0 18px 40px rgba(15,17,20,.14);}
  .header{position:relative;background:radial-gradient(circle at 88% -10%, rgba(176,141,70,.28), transparent 55%),linear-gradient(165deg,var(--ink) 0%,var(--ink-2) 100%);padding:26px 28px 58px;color:#fff;}
  .brand{font-size:11.5px;font-weight:500;letter-spacing:.14em;color:var(--brass-light);opacity:.9;}
  .header-rule{position:absolute;left:0;right:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent, var(--brass) 20%, var(--brass) 80%, transparent);}
  .medallion-row{position:relative;margin-top:64px;padding:0 24px;display:flex;justify-content:center;}
  .medallion{width:96px;height:96px;border-radius:50%;background:linear-gradient(150deg,#232830,var(--ink));border:2px solid var(--brass);box-shadow:0 10px 26px rgba(15,17,20,.28), 0 0 0 5px var(--card);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:30px;font-weight:600;color:var(--brass-light);position:absolute;top:-112px;background-size:cover;background-position:center;}
  .id-text{text-align:center;padding:8px 24px 0;}
  .name{font-family:'Fraunces',serif;font-size:23px;font-weight:600;line-height:1.2;margin:0;letter-spacing:-.01em;}
  .role-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap;}
  .role{font-size:13px;color:var(--brass);font-weight:500;}
  .matricule{font-size:10px;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:2px 9px;}
  .bio{margin:12px 0 0;font-size:12.5px;line-height:1.55;color:var(--muted);max-width:300px;margin-left:auto;margin-right:auto;}
  .status{margin:18px 24px 0;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .status-text{font-size:11px;letter-spacing:.02em;color:var(--muted);}
  .status-text b{color:var(--text);font-weight:600;}
  .body{padding:20px 24px 20px;}
  .section-label{font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin:0 0 10px;}
  .info-list{display:flex;flex-direction:column;}
  .info-row{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center;}
  .info-row:last-child{border-bottom:none;}
  .info-icon{width:20px;height:20px;flex-shrink:0;color:var(--brass);}
  .info-main{display:flex;flex-direction:column;gap:1px;}
  .info-label{font-size:10.5px;color:var(--muted);letter-spacing:.03em;}
  .info-value{font-size:14.5px;font-weight:500;color:var(--text);}
  .tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px;}
  .tag{font-size:11.5px;color:var(--ink);border:1px solid var(--line);background:#FBFAF7;border-radius:20px;padding:5px 12px;}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;}
  .btn{border-radius:3px;padding:12px 10px;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn-primary{background:var(--ink);border:1px solid var(--ink);color:var(--brass-light);grid-column:span 2;letter-spacing:.02em;}
  .footer{text-align:center;padding:18px 24px 26px;font-size:10.5px;letter-spacing:.06em;color:var(--muted);}
  .footer .mark{color:var(--brass);}
  .footer a{text-decoration:none;color:var(--muted);}
  @media (max-width:380px){.name{font-size:21px;}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="header">
    <div class="brand" id="brand">NOM DE L'ENTREPRISE</div>
    <div class="header-rule"></div>
  </div>
  <div class="medallion-row"><div class="medallion" id="photo">CD</div></div>
  <div class="id-text">
    <p class="name" id="fullname">Cédric Djohozin</p>
    <div class="role-row">
      <span class="role" id="jobtitle">Technicien biomédical</span>
      <span class="matricule" id="matricule">BME-0142</span>
    </div>
    <p class="bio" id="bio"></p>
  </div>
  <div class="status">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#B08D46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M8.5 12.5 6 21l6-3 6 3-2.5-8.5"/></svg>
    <span class="status-text"><b>Identité vérifiée</b> — chez l'entreprise depuis <span id="depuis"></span></span>
  </div>
  <div class="body">
    <div class="info-list">
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M6 21V7l6-4 6 4v14M10 21v-6h4v6M9 10h1M14 10h1M9 14h1M14 14h1"/></svg>
        <div class="info-main"><span class="info-label">Secteur</span><span class="info-value" id="service"></span></div>
      </div>
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <div class="info-main"><span class="info-label">Téléphone</span><span class="info-value" id="phone"></span></div>
      </div>
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 12 13 2 6"/><path d="M2 6h20v12H2z"/></svg>
        <div class="info-main"><span class="info-label">Email</span><span class="info-value" id="email"></span></div>
      </div>
      <div class="info-row">
        <svg class="info-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
        <div class="info-main"><span class="info-label">Localisation</span><span class="info-value" id="location"></span></div>
      </div>
    </div>

    <p class="section-label" style="margin-top:20px;">Compétences</p>
    <div class="tags" id="tags"></div>

    <div class="actions" id="actions">
      <button class="btn btn-ghost" onclick="callPhone()">Appeler</button>
      <button class="btn btn-ghost" onclick="mailPerson()">Email</button>
      <button class="btn btn-primary" onclick="saveContact()">Enregistrer le contact</button>
    </div>
  </div>
  <div class="footer"><a href="index.html"><span class="mark">◆</span> nom-entreprise.com — annuaire</a></div>
</div>

<script>
  let profil = null;
  const entreprise = "Nom de l'entreprise";
  function initiales(nom){ return nom.split(" ").map(m => m[0]).join("").slice(0,2).toUpperCase(); }

  async function chargerProfil(){
    const id = new URLSearchParams(window.location.search).get("id");
    try{
      const reponse = await fetch("profils.json");
      const profils = await reponse.json();
      profil = profils.find(p => p.id === id);
      if(!profil){ afficherErreur("Profil introuvable. Vérifiez le lien du QR code."); return; }
      afficherProfil(profil);
    }catch(e){
      console.error("Erreur chargerProfil:", e);
      afficherErreur("Erreur : " + e.message);
    }
  }

  function afficherProfil(p){
    const photoEl = document.getElementById("photo");
    if(p.photo){ photoEl.textContent = ""; photoEl.style.backgroundImage = `url('${p.photo}')`; }
    else{ photoEl.style.backgroundImage = "none"; photoEl.textContent = initiales(p.nom); }

    document.getElementById("fullname").textContent = p.nom;
    document.getElementById("jobtitle").textContent = p.fonction;
    document.getElementById("matricule").textContent = p.matricule || "";
    document.getElementById("bio").textContent = p.bio || "";
    document.getElementById("depuis").textContent = p.depuis || "—";
    document.getElementById("service").textContent = p.service;
    document.getElementById("phone").textContent = p.telephoneAffiche;
    document.getElementById("email").textContent = p.email;
    document.getElementById("location").textContent = p.localisation;

    const tagsEl = document.getElementById("tags");
    (p.competences || []).forEach(c => {
      const s = document.createElement("span");
      s.className = "tag"; s.textContent = c;
      tagsEl.appendChild(s);
    });
    if(!p.competences || p.competences.length === 0){
      document.querySelector(".section-label").style.display = "none";
    }

    if(p.linkedin){
      const a = document.createElement("a");
      a.href = p.linkedin; a.target = "_blank";
      a.className = "btn btn-ghost"; a.textContent = "LinkedIn";
      document.getElementById("actions").insertBefore(a, document.querySelector(".btn-primary"));
    }
  }

  function afficherErreur(message){
    document.getElementById("card").innerHTML = `<div style="padding:50px 24px;text-align:center;color:var(--muted);font-size:14px;">${message}</div>`;
  }

  chargerProfil();

  function callPhone(){ if(profil) window.location.href = "tel:" + profil.telephone; }
  function mailPerson(){ if(profil) window.location.href = "mailto:" + profil.email; }
  function saveContact(){
    if(!profil) return;
    const vcard = ["BEGIN:VCARD","VERSION:3.0","FN:"+profil.nom,"TITLE:"+profil.fonction,"ORG:"+entreprise,
      "TEL;TYPE=CELL:"+profil.telephone,"EMAIL:"+profil.email,"ADR:;;"+profil.localisation,"END:VCARD"].join("\n");
    const blob = new Blob([vcard], { type: "text/vcard" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = profil.nom.replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
</script>
</body>
</html>
